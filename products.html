<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品中心 · 陕西周至翠香猕猴桃</title>
<meta name="description" content="周至猕猴桃当季鲜果，翠香10斤装、翠香5斤礼盒、红阳5斤装、华优5斤装，产地直供，坏果包赔。">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="site-nav"></div>

<header class="page-header">
  <h1>当季鲜果</h1>
  <p>周至产地直供，坏果包赔</p>
</header>

<section>
  <div id="product-list" class="product-grid"></div>
</section>

<div id="site-wechat"></div>
<div id="site-footer"></div>
<div id="site-mobile-nav"></div>

<script src="/products-data.js"></script>
<script>
  const container = document.getElementById("product-list");
  if (container && typeof PRODUCTS !== "undefined") {
    container.innerHTML = PRODUCTS.map(p => `
      <div class="product-card">
        <div class="product-img-wrap">
          <img src="${p.image}" alt="${p.name}">
          ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ""}
        </div>
        <div class="product-info">
          <h3>${p.name}</h3>
          <p class="desc">${p.desc}</p>
          <div class="price-row">
            <span class="price">${p.price}</span>
            <span class="unit">${p.unit}</span>
          </div>
          <a href="${p.detailUrl}" class="btn-outline">查看详情</a>
        </div>
      </div>
    `).join("");
  }
</script>
<script src="/common.js"></script>
</body>
</html>
